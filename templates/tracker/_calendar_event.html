<a class="calendar-event ev-{{ ev.status }}{% if ev.done %} is-done{% endif %}{% if full %} is-full{% endif %}" style="border-left-color: {{ ev.color }}" href="{{ ev.url }}" title="{{ ev.title }} - {{ ev.detail }} ({{ ev.status_label }}, {{ ev.batch }})">{% if ev.time %}<b>{{ ev.time|time:"h:i A" }}</b> {% endif %}{{ ev.title }}{% if full %}<small>{{ ev.detail }}{% if ev.type %} · {{ ev.type }}{% endif %} · {{ ev.status_label }} · {{ ev.batch }}</small>{% endif %}</a>
