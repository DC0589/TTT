{% extends "base.html" %}
{% block title %}{{ page_title }}{% endblock %}
{% block content %}
<div class="breadcrumb"><a href="{% if user.is_hr %}{% url 'hr_students' %}{% else %}{% url 'admin_students' %}{% endif %}">Students</a><span aria-hidden="true">/</span><span>{{ page_title }}</span></div>
<section class="page-heading">
  <div><p class="eyebrow">STUDENT ACCOUNTS</p><h1>{{ page_title }}</h1><p>Create a student account for your community.</p></div>
</section>
<section class="panel standalone-form-panel">
  <form method="post" class="stack-form">{% csrf_token %}{% include "tracker/_form.html" %}
    <div class="form-page-actions"><button class="button button-primary" type="submit">Create student</button><a class="button button-quiet" href="{% if user.is_hr %}{% url 'hr_students' %}{% else %}{% url 'admin_students' %}{% endif %}">Cancel</a></div>
  </form>
</section>
{% endblock %}
