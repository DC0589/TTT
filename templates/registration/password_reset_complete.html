{% extends "base.html" %}
{% block title %}Password changed{% endblock %}
{% block content %}
<div class="auth-card">
  <p class="eyebrow">ALL SET</p>
  <h2>Your password has been changed.</h2>
  <p class="auth-card-description">You can now log in with your new password.</p>
  <p class="auth-switch"><a href="{% url 'login' %}">Log in</a></p>
</div>
{% endblock %}
